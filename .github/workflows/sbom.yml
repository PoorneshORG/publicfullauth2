name: SBOM Scan and Upload

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      DT_URL: ${{ secrets.DEPENDENCY_TRACK_API_URL }}
      DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      PROJECT_NAME: ${{ github.repository }}
      PROJECT_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # Install CycloneDX CLI
      - name: Install CycloneDX CLI (v0.29.1)
        run: |
          C_VERSION=0.29.1
          curl -L -o cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${C_VERSION}/cyclonedx-linux-x64
          chmod +x cyclonedx
          sudo mv cyclonedx /usr/local/bin/
          cyclonedx --version

      # ---------- Java / Maven ----------
      - name: Generate SBOM - Maven
        if: hashFiles('pom.xml') != ''
        run: |
          mvn -B clean install -DskipTests
          cyclonedx mvn --output-file sbom-maven.json

      # ---------- Java / Gradle ----------
      - name: Generate SBOM - Gradle
        if: hashFiles('build.gradle*') != ''
        run: |
          ./gradlew build -x test
          cyclonedx gradle --output-file sbom-gradle.json

      # ---------- Node.js / React ----------
      - name: Generate SBOM - Node.js
        if: hashFiles('package-lock.json') != '' || hashFiles('yarn.lock') != ''
        run: |
          if [ -f package-lock.json ]; then
            cyclonedx npm --output-file sbom-node.json
          elif [ -f yarn.lock ]; then
            cyclonedx yarn --output-file sbom-node.json
          fi

      # ---------- Python ----------
      - name: Generate SBOM - Python
        if: hashFiles('requirements.txt') != '' || hashFiles('poetry.lock') != '' || hashFiles('Pipfile.lock') != ''
        run: |
          if [ -f requirements.txt ]; then
            cyclonedx pip requirements.txt --output-file sbom-python.json
          elif [ -f poetry.lock ]; then
            cyclonedx poetry --output-file sbom-python.json
          elif [ -f Pipfile.lock ]; then
            cyclonedx pipenv --output-file sbom-python.json
          fi

      # ---------- Flutter ----------
      - name: Generate SBOM - Flutter
        if: hashFiles('pubspec.lock') != ''
        run: |
          cyclonedx pub --output-file sbom-flutter.json

      # ---------- Merge Multiple SBOMs ----------
      - name: Merge SBOMs
        run: |
          files=$(ls sbom-*.json 2>/dev/null || true)
          if [ -n "$files" ]; then
            cyclonedx merge $files --output-file sbom-merged.json --output-format json
          else
            echo "No SBOMs generated!"
            exit 1
          fi

      # ---------- Create or Reuse Project in Dependency-Track ----------
      - name: Get or Create Project
        id: project
        run: |
          UUID=$(curl -s -H "X-Api-Key: $DT_API_KEY" \
            "$DT_URL/api/v1/project?name=$PROJECT_NAME" | jq -r '.[0].uuid // empty')

          if [ -z "$UUID" ]; then
            echo "Creating new project..."
            UUID=$(curl -s -X PUT -H "Content-Type: application/json" \
              -H "X-Api-Key: $DT_API_KEY" \
              -d '{"name":"'"$PROJECT_NAME"'","version":"'"$PROJECT_VERSION"'"}' \
              "$DT_URL/api/v1/project" | jq -r '.uuid')
          fi

          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      # ---------- Upload SBOM ----------
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -s -X POST "$DT_URL/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            -F "project=${{ steps.project.outputs.uuid }}" \
            -F "bom=@sbom-merged.json"


